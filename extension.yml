schema_version: "1.0"

extension:
  id: "qc"
  name: "QC Workflow (Link_AI_Pro skills)"
  version: "2.2.0"
  description: "Profile-based team QC review, test design, automation planning and local evidence across project types"
  author: "QC Team"
  repository: "https://github.com/AhmedZaher1233/Link_AI_Pro"
  license: "MIT"

requires:
  speckit_version: ">=0.10.0"
  commands:
    - "speckit.constitution"
    - "speckit.specify"
    - "speckit.clarify"
    - "speckit.plan"
    - "speckit.tasks"
    - "speckit.analyze"
    - "speckit.implement"

provides:
  commands:
    - name: "speckit.qc.setup"
      file: "commands/setup.md"
      description: "Configure project profile, required tools, QA paths and constitution policy"
    - name: "speckit.qc.review"
      file: "commands/review.md"
      description: "Review clarified spec.md with link-qc-2-review-requirements"
    - name: "speckit.qc.plan"
      file: "commands/plan.md"
      description: "Plan feature automation structure, prerequisites, test data and requirement coverage"
    - name: "speckit.qc.tcs"
      file: "commands/tcs.md"
      description: "Design manual TCs before development with link-qc-3-generate-manual-test-cases"
    - name: "speckit.qc.validate"
      file: "commands/validate.md"
      description: "Validate existing browser TCs with playwright-cli (skill 3c) when applicable"
    - name: "speckit.qc.gate"
      file: "commands/gate.md"
      description: "Gate - Block implementation until QC artifacts are approved"
    - name: "speckit.qc.automate"
      file: "commands/automate.md"
      description: "Implement and verify approved test work with the selected runner"
    - name: "speckit.qc.review-automation"
      file: "commands/review-automation.md"
      description: "Review automation code, data lifecycle and results for each selected runner"
    - name: "speckit.qc.run-env"
      file: "commands/run-env.md"
      description: "Run reviewed scope on a configured project environment or artifact"
    - name: "speckit.qc.execute"
      file: "commands/execute.md"
      description: "Assess applicable manual/automated evidence and release readiness"

hooks:
  after_clarify:
    command: "speckit.qc.review"
    optional: false
    description: "QC reviews requirements after clarification has finished"
  after_plan:
    command: "speckit.qc.plan"
    optional: false
    description: "Generate the test plan, feature automation design and traceability matrix"
  after_tasks:
    command: "speckit.qc.tcs"
    optional: true
    prompt: "Generate manual test cases for QC review now?"
    description: "Design manual TCs before development"
  before_implement:
    command: "speckit.qc.gate"
    optional: false
    description: "Stop implementation if the test plan or TCs are not approved"
  after_implement:
    command: "speckit.qc.validate"
    optional: true
    prompt: "Check applicability and validate browser TCs with CLI?"
    description: "Optional browser-only validation; other surfaces use the approved execution route"

tags:
  - "testing"
  - "qa"
  - "playwright"
