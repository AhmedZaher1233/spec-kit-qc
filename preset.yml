schema_version: "1.0"

preset:
  id: "qc"
  name: "QC in the default Spec Kit workflow"
  version: "4.0.0"
  description: "Quality Control section for the constitution, a Testing section for plan.md and QC task rows for tasks.md — no command changes. Optional packaging of the files in handover/."
  author: "QC Team"
  repository: "https://github.com/AhmedZaher1233/spec-kit-qc"
  license: "MIT"

requires:
  # Template composition (append) through the preset stack.
  speckit_version: ">=0.16.2"

provides:
  templates:
    # The same files the handover tells the team to paste; `append` keeps the core template byte-for-byte.
    - type: "template"
      name: "constitution-template"
      file: "handover/.specify/memory/constitution.QC-section.md"
      description: "Quality Control section (QC-0 … QC-18) and the QC project configuration table"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "handover/.specify/templates/plan-template.Testing-section.md"
      description: "plan.md ## Testing section (story risk, traceability, high-level test cases, test data, automation approach, testability asks, open questions)"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "handover/.specify/templates/tasks-template.QC-rows.md"
      description: "Quality Control task rows for Foundational, each user story and Polish (placement comments inside)"
      strategy: "append"
    - type: "template"
      name: "test-cases-template"
      file: "handover/.specify/templates/test-cases-template.md"
      description: "TEST-CASES-{feature}.md — the format read by link-qc-5-test-run-automation and link-qc-md-to-html"
    - type: "template"
      name: "test-data-template"
      file: "handover/.specify/templates/test-data-template.md"
      description: "TEST-DATA-{feature}.md — environments [E], accounts [A] by secret name, data items [D]"

tags:
  - "testing"
  - "qa"
  - "quality"
  - "playwright"
