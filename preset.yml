schema_version: "1.0"

preset:
  id: "qc"
  name: "QC in the Spec Kit lifecycle"
  version: "3.0.0"
  description: "Testing built into every Spec Kit stage: constitution QC article, test plan beside the development plan, test cases at tasks, validation and automation at implement"
  author: "QC Team"
  repository: "https://github.com/AhmedZaher1233/Link_AI_Pro"
  license: "MIT"

requires:
  # Template composition (append) and command composition (wrap) through the preset stack.
  speckit_version: ">=0.16.2"

provides:
  templates:
    # ---- Core templates extended in place (strategy: append keeps the original byte-for-byte) ----
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Quality Control article (rules QC-1 … QC-16, roles, release floor) and the QC project configuration table"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Testing Strategy section of plan.md: pointer to test-plan.md, selected routes, QC asks for development"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "QC phases in tasks.md: test-case expansion, testability asks, post-implementation validation / automation / fix loop"
      strategy: "append"

    # ---- QC artifact templates (resolved by the wrapped commands through `resolve-template`) ----
    - type: "template"
      name: "test-plan-template"
      file: "templates/test-plan-template.md"
      description: "Feature test plan written beside plan.md - the single QC review point (high-level test cases + open questions)"
    - type: "template"
      name: "test-cases-template"
      file: "templates/test-cases-template.md"
      description: "Detailed test cases (TEST-CASES-{feature}.md) expanded from the approved test plan; format consumed by skills 3c and 5"
    - type: "template"
      name: "test-data-template"
      file: "templates/test-data-template.md"
      description: "Plain-English test data (TEST-DATA-{feature}.md): environments [E], accounts [A] by secret name, data items [D]"
    - type: "template"
      name: "qa-manifest-template"
      file: "templates/qa-manifest-template.json"
      description: "Testing/qa-manifest.json - paths and runner the retained QC skills read"
    - type: "template"
      name: "project-learning-template"
      file: "templates/project-learning-template.md"
      description: "Testing/project-learning.md - shared QA knowledge the retained QC skills read before asking"

    # ---- Core commands wrapped: {CORE_TEMPLATE} keeps the original command, QC steps follow it ----
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Constitution + QC project configuration, Testing/qa-manifest.json and project-learning.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify + requirement testability review recorded in checklists/requirements.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan + test-plan.md with high-level test cases, automation approach and open questions"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tasks + approval gate, detailed TEST-CASES / TEST-DATA expansion and QC phases"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze + QC consistency: traceability, approval freshness, open questions, QC phases"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement + run the app, CLI validation, automation, fix loop, updated test cases and run results"
      strategy: "wrap"

tags:
  - "testing"
  - "qa"
  - "quality"
  - "playwright"
